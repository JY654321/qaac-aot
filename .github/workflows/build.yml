name: Build AOT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish AOT (win-x64)
        run: dotnet publish -c Release -r win-x64 -p:PublishAot=true --self-contained

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QaacBatch-win-x64
          path: bin/Release/net10.0/win-x64/publish/QaacBatch.exe
          if-no-files-found: error
